<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="100%" style="stop-color:#0a0a14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f2fe"/>
      <stop offset="100%" style="stop-color:#4facfe"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#00f2fe;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="65%" r="45%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#4facfe;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Color swatches strip -->
  <rect x="80" y="390" width="80" height="56" rx="8" fill="#ef4444"/>
  <rect x="172" y="390" width="80" height="56" rx="8" fill="#f97316"/>
  <rect x="264" y="390" width="80" height="56" rx="8" fill="#eab308"/>
  <rect x="356" y="390" width="80" height="56" rx="8" fill="#22c55e"/>
  <rect x="448" y="390" width="80" height="56" rx="8" fill="#06b6d4"/>
  <rect x="540" y="390" width="80" height="56" rx="8" fill="#3b82f6"/>
  <rect x="632" y="390" width="80" height="56" rx="8" fill="#8b5cf6"/>
  <rect x="724" y="390" width="80" height="56" rx="8" fill="#ec4899"/>
  <rect x="816" y="390" width="80" height="56" rx="8" fill="#14b8a6"/>
  <rect x="908" y="390" width="80" height="56" rx="8" fill="#f43f5e"/>
  <rect x="1000" y="390" width="80" height="56" rx="8" fill="#a855f7"/>
  <rect x="1092" y="390" width="28" height="56" rx="8" fill="#64748b"/>

  <!-- Eyebrow tag -->
  <rect x="80" y="120" width="238" height="36" rx="18" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="199" y="143" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="2">DESIGN SYSTEM GENERATOR</text>

  <!-- Main title -->
  <text x="80" y="238" font-family="system-ui, sans-serif" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="-3">Armonic</text>
  <text x="80" y="325" font-family="system-ui, sans-serif" font-size="72" font-weight="900" letter-spacing="-3">
    <tspan fill="url(#accent)">Themes</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="490" font-family="system-ui, sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.55)">14 colores semánticos · Modo claro y oscuro · Exporta en un clic</text>

  <!-- URL badge -->
  <rect x="80" y="548" width="290" height="38" rx="8" fill="rgba(0,242,254,0.08)" stroke="rgba(0,242,254,0.25)" stroke-width="1"/>
  <text x="225" y="572" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#00f2fe" text-anchor="middle">themes.devcito.org</text>
</svg>
