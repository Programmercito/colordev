<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="gradTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="gradBot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#023e8a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Pilar vertical (queda por debajo) -->
  <rect x="46" y="40" width="36" height="72" rx="18" fill="url(#gradBot)" />
  
  <!-- Barra superior (flotando con sombra) -->
  <rect x="18" y="16" width="92" height="36" rx="18" fill="url(#gradTop)" filter="url(#shadow)" />
</svg>
